services:
  mlbb-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlbb_news_agent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./mlbb_news.db:/app/mlbb_news.db
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/mlbb_news.db
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

